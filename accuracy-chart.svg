<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Validation and held-out test accuracy by model</title>
  <desc id="desc">Grouped horizontal bars compare validation accuracy and held-out test accuracy for BERT-base, ResNet-50, BERT-base plus ResNet-50, and fine-tuned DeiT III B/16.</desc>
  <rect width="900" height="390" rx="18" fill="#fbfcfe"/>
  <text x="36" y="40" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">Accuracy by model</text>
  <text x="36" y="64" font-family="Arial, sans-serif" font-size="12" fill="#586579">Validation and held-out test accuracy · percent</text>
  <rect x="620" y="24" width="12" height="12" rx="3" fill="#6f93d8"/><text x="638" y="35" font-family="Arial, sans-serif" font-size="12" fill="#465267">Validation</text>
  <rect x="724" y="24" width="12" height="12" rx="3" fill="#173f7a"/><text x="742" y="35" font-family="Arial, sans-serif" font-size="12" fill="#465267">Held-out test</text>
  <g stroke="#e2e7ef" stroke-width="1">
    <line x1="230" y1="92" x2="230" y2="330"/><line x1="356" y1="92" x2="356" y2="330"/><line x1="482" y1="92" x2="482" y2="330"/><line x1="608" y1="92" x2="608" y2="330"/><line x1="734" y1="92" x2="734" y2="330"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#778296" text-anchor="middle">
    <text x="230" y="350">0%</text><text x="356" y="350">25%</text><text x="482" y="350">50%</text><text x="608" y="350">75%</text><text x="734" y="350">100%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#27364d">
    <text x="36" y="122">BERT-base · title</text>
    <text x="36" y="180">ResNet-50 · image</text>
    <text x="36" y="238">BERT + ResNet · fused</text>
    <text x="36" y="296">DeiT III B/16 · image</text>
  </g>
  <g>
    <rect x="230" y="103" width="416.0" height="14" rx="7" fill="#6f93d8"/><rect x="230" y="121" width="413.6" height="14" rx="7" fill="#173f7a"/>
    <rect x="230" y="161" width="406.3" height="14" rx="7" fill="#6f93d8"/><rect x="230" y="179" width="407.0" height="14" rx="7" fill="#173f7a"/>
    <rect x="230" y="219" width="444.7" height="14" rx="7" fill="#6f93d8"/><rect x="230" y="237" width="443.3" height="14" rx="7" fill="#173f7a"/>
    <rect x="230" y="277" width="417.0" height="14" rx="7" fill="#6f93d8"/><rect x="230" y="295" width="417.2" height="14" rx="7" fill="#173f7a"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#26364b">
    <text x="652" y="115">82.74%</text><text x="650" y="133">82.39%</text>
    <text x="642" y="173">80.93%</text><text x="643" y="191">81.16%</text>
    <text x="681" y="231">88.51%</text><text x="680" y="249">88.15%</text>
    <text x="653" y="289">83.02%</text><text x="653" y="307">83.13%</text>
  </g>
  <text x="36" y="374" font-family="Arial, sans-serif" font-size="10" fill="#778296">Single-seed results; text and image studies use different test cohorts.</text>
</svg>
